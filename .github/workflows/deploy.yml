name: Deploy Pokedex to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: app

      - name: Build Combined Web Target
        working-directory: app
        run: ./gradlew :webApp:composeCompatibilityBrowserDistribution

      - name: Copy Documentation to Web Build Target
        run: |
          mkdir -p app/webApp/build/dist/composeWebCompatibility/productionExecutable/docs
          cp -r docs/* app/webApp/build/dist/composeWebCompatibility/productionExecutable/docs/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'app/webApp/build/dist/composeWebCompatibility/productionExecutable'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
